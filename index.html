<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>

    <main class="main-container">
        <header class="input-container">
            <input type="text" class="city-input" placeholder="Search City">
            <button type="submit" class="search-btn" aria-label="Search Button">
                <img src="assets/searchIcon.svg" alt="Search Button"/>
            </button>
        </header>

        <section class="weather-info">
            <div class="location-date-container">
                <div class="location">
                    <img src="assets/locationIcon.svg" alt="Location"/>
                    <h4 class="country-txt">Paris</h4>
                </div>
                <h5 class="current-date-txt regular-txt">Mon, 14 Sep</h5>
            </div>

            <div class="weather-summary-container">
                <img src="assets/weather/Clouds.png" alt="" class="weather-summary-img">
                <div class="weather-summary-info">
                    <h2 class="temp-txt">20 °C</h1>
                    <h4 class="condition-txt regular-txt">Clouds</h3>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <img src="assets/waterIcon.svg" alt="Humidity">
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">55%</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <img src="assets/airIcon.svg" alt="Wind">
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind Speed</h5>
                        <h5 class="wind-value-txt">2 M/s</h5>
                    </div>
                </div>
            </div>

            
        </section>
    </main>
    
</body>
</html>
